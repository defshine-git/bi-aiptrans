  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>

    *{box-sizing:border-box;margin:0;padding:0} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top,0)}

    @media(max-width:767px){header,footer{flex-direction:column;align-items:stretch;gap:8px}.header-controls{flex-wrap:wrap}.control-select{flex:1 1 45%;min-width:0}.card-body,.edit-grid{grid-template-columns:1fr}.footer-btn-group{width:100%}.footer-btn-group .btn,.btn-record{flex:1}.brand-title{justify-content:space-between}}

</head>
<body>
<header><div class="brand-title"><span>⚓ Bilingual Transcriber</span><div class="status-badge"><span class="status-dot" id="statusDot"></span><span id="statusText">待機中</span></div></div><div class="header-controls">
<select id="directionSelect" class="control-select"><option value="AUTO">翻訳: 自動切替 (英⇄日)</option><option value="EN_TO_JA">固定: 英語 ➔ 日本語</option><option value="JA_TO_EN">固定: 日本語 ➔ 英語</option></select>
<select id="categorySelect" class="control-select"><option value="HKC">分野: HKC</option><option value="EU-SRR">分野: EU-SRR</option><option value="HSE">分野: HSE</option><option value="IHM">分野: IHM</option><option value="Common">分野: 全般</option></select>
<select id="engineSelect" class="control-select"><option value="GEMINI_UNARY" selected>Engine: Gemini (GAS連携)</option><option value="GEMINI_LIVE">Engine: Gemini Live (WS)</option><option value="WEB_SPEECH">Engine: Web Speech</option><option value="LOCAL_WHISPER">Engine: Local Whisper</option></select><button id="settingsBtn" class="icon-btn" title="設定">⚙️</button></div></header>
<main id="logContainer"><div id="livePreviewContainer" class="live-preview-box" style="display:none"><div class="live-preview-header"><span>🔴 LIVE リアルタイム音声認識中</span><span class="engine-tag">Gemini Live</span></div><div id="livePreviewText" class="live-preview-text">話しかけてください...</div></div><div class="empty-state" id="emptyState"><h3>対面ミーティング音声認識を開始してください</h3><p>「録音開始」を押すと文字起こし・翻訳を開始します。</p></div></main>
<footer><button id="recordBtn" class="btn btn-record">🎤 録音開始</button><div class="footer-btn-group"><button id="copyMdBtn" class="btn btn-clear">📋 コピー</button><button id="clearBtn" class="btn btn-clear">ログクリア</button><button id="saveBtn" class="btn btn-save" disabled>💾 Google ドキュメントに保存</button></div></footer>
<div class="modal-overlay" id="settingsModal"><div class="modal-content"><div class="modal-header"><span>設定</span><button id="closeModalBtn" class="card-action-btn">×</button></div>
<div class="form-group"><label for="directApiKeyInput">Gemini APIキー（Live直接接続時のみ）</label><input type="password" id="directApiKeyInput" autocomplete="off" placeholder="API key"><small class="hint">本番では短期トークンを推奨します。</small></div>
<div class="form-group"><label for="gasApiUrlInput">GAS Web App URL</label><input type="url" id="gasApiUrlInput" autocomplete="url" placeholder="https://script.google.com/macros/s/DEPLOYMENT_ID/exec"><div style="margin-top:6px"><button id="testGasBtn" class="btn btn-clear">GAS接続テスト</button><span id="testGasResult" class="result"></span></div></div>
<div class="form-group"><label>📱 スマホ連携</label><button id="sharePhoneBtn" class="btn btn-clear" style="width:100%">📲 設定URL / QRコード生成</button><div id="sharePhoneArea" class="qr-area"><div id="qrCodeContainer"></div><input type="text" id="shareUrlInput" readonly><button id="copyShareUrlBtn" class="btn btn-clear" style="margin-top:6px">URLをコピー</button></div></div>
<div class="form-group"><label for="localEndpointInput">Local Whisper URL</label><input type="url" id="localEndpointInput" autocomplete="url" placeholder="http://192.168.1.50:8000/transcribe"></div>
<div class="form-group"><button id="refreshCacheBtn" class="btn btn-clear">🔄 辞書キャッシュ強制クリア</button><span id="cacheResult" class="result"></span></div><div class="modal-actions"><button id="saveSettingsBtn" class="btn btn-record">設定を保存</button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const recordBtn=$('recordBtn'),saveBtn=$('saveBtn'),clearBtn=$('clearBtn'),copyMdBtn=$('copyMdBtn'),statusDot=$('statusDot'),statusText=$('statusText'),logContainer=$('logContainer'),emptyState=$('emptyState'),directionSelect=$('directionSelect'),categorySelect=$('categorySelect'),engineSelect=$('engineSelect'),settingsModal=$('settingsModal'),gasApiUrlInput=$('gasApiUrlInput'),directApiKeyInput=$('directApiKeyInput'),localEndpointInput=$('localEndpointInput'),livePreviewContainer=$('livePreviewContainer'),livePreviewText=$('livePreviewText'),sharePhoneArea=$('sharePhoneArea'),qrCodeContainer=$('qrCodeContainer'),shareUrlInput=$('shareUrlInput'),testGasResult=$('testGasResult'),cacheResult=$('cacheResult');
const isGasEnvironment=typeof google!=='undefined'&&google.script&&google.script.run;
const WS_STATE=Object.freeze({IDLE:'IDLE',TOKEN:'TOKEN',CONNECTING:'CONNECTING',OPEN:'OPEN',READY:'READY',CLOSING:'CLOSING',CLOSED:'CLOSED',ERROR:'ERROR'});
const roles=['Auditor (監査員)','Yard Rep (ヤード担当者)','Facility (施設側)','Other (その他)'];
let isRecording=false,mediaStream=null,audioContext=null,mediaRecorder=null,analyserNode=null,silenceTimer=null,maxChunkTimer=null,audioChunks=[],speechDetected=false,webSpeechRecognition=null,transcriptStore=[];
let liveWebSocket=null,liveAudioContext=null,liveMediaStream=null,liveProcessor=null,liveConnectTimer=null,isLiveReady=false,liveConfig=null;
const SILENCE_THRESHOLD=-45,SILENCE_DURATION_MS=1000,MAX_CHUNK_DURATION_MS=14000;
function setConnectionStatus(state,detail=''){const map={IDLE:['待機中',''],TOKEN:['Live認証中...',''],CONNECTING:['WS接続中...',''],OPEN:['WS接続済み・初期化中...',''],READY:['LIVE接続完了','ready'],CLOSING:['WS切断中...',''],CLOSED:['WS切断',''],ERROR:['WS接続エラー','']};const [text,cls]=map[state]||map.ERROR;statusText.textContent=detail?`${text}: ${detail}`:text;statusDot.className=`status-dot ${cls}`;livePreviewContainer.style.display=state===WS_STATE.READY?'flex':'none';}
function getGasApiUrl(){return gasApiUrlInput.value.trim()||localStorage.getItem('gas_api_url')||''}
function isValidGasUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&u.pathname.endsWith('/exec')}catch{return false}}
function callApi(action,payload,onSuccess,onFailure){const ok=onSuccess||(()=>{}),ng=onFailure||console.error;if(isGasEnvironment){const r=google.script.run.withSuccessHandler(ok).withFailureHandler(ng);switch(action){case'getLiveToken':r.createLiveSessionToken(payload.category);break;case'processAudioPass1':r.processAudioPass1(payload.audioBase64,payload.mimeType,payload.category);break;case'processTranslationPass2':r.processTranslationPass2(payload.originalText,payload.category,payload.direction);break;case'saveToGoogleDoc':r.saveToGoogleDoc(payload.transcriptList,payload.category,payload.direction);break;case'refreshGlossaryCache':r.refreshGlossaryCache();break;case'ping':ok({success:true,message:'GAS埋め込み環境'});break;default:ng(new Error(`未対応のAPIアクション: ${action}`))}return}callExternalApi(action,payload).then(ok).catch(ng)}
async function callExternalApi(action,payload){const apiUrl=getGasApiUrl();if(!apiUrl)throw new Error('GAS Web App URLが未設定です。');const c=new AbortController(),timer=setTimeout(()=>c.abort(),30000);try{const res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload}),signal:c.signal,redirect:'follow'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const text=await res.text();let data;try{data=JSON.parse(text)}catch{throw new Error(`JSON以外の応答: ${text.slice(0,120)}`)}if(data?.success===false)throw new Error(data.error||'GAS処理失敗');return data}catch(e){if(e.name==='AbortError')throw new Error('GAS APIがタイムアウトしました。');throw e}finally{clearTimeout(timer)}}
async function toggleRecording(){if(isRecording)stopRecording();else await startRecording()}
async function startRecording(){recordBtn.disabled=true;try{const engine=engineSelect.value;if(engine==='GEMINI_LIVE'){await startGeminiLiveStreaming();if(!isLiveReady)throw new Error('WS準備完了を確認できません。')}else if(engine==='WEB_SPEECH'){startWebSpeech()}else{isRecording=true;await startAudioStream()}isRecording=true;recordBtn.classList.add('active');recordBtn.textContent='⏹️ 録音停止';if(engine!=='GEMINI_LIVE'){statusDot.className='status-dot recording';statusText.textContent='録音中 (REC)'}}catch(e){isRecording=false;stopGeminiLiveStreaming();statusText.textContent='開始失敗';alert(`録音を開始できませんでした:\n${e.message}`)}finally{recordBtn.disabled=false}}
function stopRecording(){isRecording=false;speechDetected=false;recordBtn.classList.remove('active');recordBtn.textContent='🎤 録音開始';setConnectionStatus(WS_STATE.IDLE);stopGeminiLiveStreaming();if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();mediaStream?.getTracks().forEach(t=>t.stop());if(audioContext&&audioContext.state!=='closed')audioContext.close();try{webSpeechRecognition?.stop()}catch{}clearTimeout(silenceTimer);clearTimeout(maxChunkTimer)}
async function startAudioStream(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('マイク利用にはHTTPSが必要です。');mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});audioContext=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume();const source=audioContext.createMediaStreamSource(mediaStream);analyserNode=audioContext.createAnalyser();analyserNode.fftSize=512;source.connect(analyserNode);initMediaRecorder();monitorAudioLevel()}
function initMediaRecorder(){audioChunks=[];const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];const mime=types.find(t=>MediaRecorder.isTypeSupported?.(t))||'';mediaRecorder=mime?new MediaRecorder(mediaStream,{mimeType:mime}):new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};mediaRecorder.onstop=()=>{clearTimeout(maxChunkTimer);clearTimeout(silenceTimer);const hadSpeech=speechDetected; speechDetected=false;const chunks=audioChunks;audioChunks=[];if(chunks.length&&hadSpeech)handleAudioChunk(new Blob(chunks,{type:mediaRecorder.mimeType}));if(isRecording){mediaRecorder.start();scheduleMaxChunkTimer()}};mediaRecorder.start();scheduleMaxChunkTimer()}
function scheduleMaxChunkTimer(){clearTimeout(maxChunkTimer);maxChunkTimer=setTimeout(()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()},MAX_CHUNK_DURATION_MS)}
function monitorAudioLevel(){const b=new Float32Array(analyserNode.fftSize);const check=()=>{if(!isRecording)return;analyserNode.getFloatTimeDomainData(b);const rms=Math.sqrt(b.reduce((s,v)=>s+v*v,0)/b.length),db=20*Math.log10(Math.max(rms,1e-5));if(db>=SILENCE_THRESHOLD){speechDetected=true;clearTimeout(silenceTimer);silenceTimer=null}else if(speechDetected&&!silenceTimer)silenceTimer=setTimeout(()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()},SILENCE_DURATION_MS);requestAnimationFrame(check)};requestAnimationFrame(check)}
async function blobToBase64(blob){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(r.error||new Error('音声読込失敗'));r.onload=()=>{const s=String(r.result||''),i=s.indexOf(',');if(i<0)reject(new Error('Base64形式不正'));else resolve(s.slice(i+1))};r.readAsDataURL(blob)})}
async function handleAudioChunk(blob){if(blob.size<3000)return;const engine=engineSelect.value,category=categorySelect.value,cardId=`card_${Date.now()}_${Math.random().toString(36).slice(2)}`,time=new Date().toLocaleTimeString('ja-JP',{hour12:false});if(engine==='LOCAL_WHISPER')return processLocalWhisper(blob,cardId,time,category);try{const base64Audio=await blobToBase64(blob);statusText.textContent='認識中...';callApi('processAudioPass1',{audioBase64:base64Audio,mimeType:blob.type.split(';')[0],category},res=>{statusText.textContent=isRecording?'録音中 (REC)':'待機中';if(!res?.hasSpeech||!res.originalText)return;const dir=directionSelect.value;addTranscriptItem({id:cardId,time,speaker:dir==='JA_TO_EN'?roles[0]:'話者 (自動判定中)',originalText:res.originalText,translatedText:'',engine:'Gemini',direction:dir,autoSpeaker:true,isTranslating:true});processPass2(cardId,res.originalText,category,dir)},e=>{statusText.textContent=isRecording?'録音中 (REC)':'待機中';alert(`音声認識エラー: ${e.message}`)})}catch(e){alert(e.message)}}
function processPass2(id,text,category,direction){callApi('processTranslationPass2',{originalText:text,category,direction},res=>updateCardTranslation(id,res?.translatedText||'',res?.direction,res?.detectedLanguage),()=>updateCardTranslation(id,'【翻訳エラー / 再試行可能】'))}
async function startGeminiLiveStreaming(){if(liveWebSocket&&liveWebSocket.readyState!==WebSocket.CLOSED)throw new Error('WS接続が既に存在します。');setConnectionStatus(WS_STATE.TOKEN);const directKey=directApiKeyInput.value.trim()||localStorage.getItem('gemini_api_key')||'';const tokenRes=await new Promise((resolve,reject)=>callApi('getLiveToken',{category:categorySelect.value},resolve,reject));if(!tokenRes?.success||!tokenRes.token)throw new Error(tokenRes?.error||'Liveトークン取得失敗');if(!tokenRes.wsUrl)throw new Error('createLiveSessionTokenの戻り値にwsUrlがありません。');liveConfig=tokenRes;setConnectionStatus(WS_STATE.CONNECTING);await new Promise((resolve,reject)=>{let settled=false;liveConnectTimer=setTimeout(()=>{if(settled)return;settled=true;setConnectionStatus(WS_STATE.ERROR,'タイムアウト');liveWebSocket?.close(4000,'timeout');reject(new Error('WS接続タイムアウト'))},10000);liveWebSocket=new WebSocket(tokenRes.wsUrl);liveWebSocket.onopen=()=>{setConnectionStatus(WS_STATE.OPEN);const setup=tokenRes.setupMessage||{setup:{token:tokenRes.token,category:categorySelect.value,direction:directionSelect.value}};liveWebSocket.send(typeof setup==='string'?setup:JSON.stringify(setup))};liveWebSocket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{console.warn('非JSON WSメッセージ',e.data);return}if(m.setupComplete||m.ready===true){clearTimeout(liveConnectTimer);isLiveReady=true;setConnectionStatus(WS_STATE.READY);if(!settled){settled=true;resolve()}return}handleLiveMessage(m)};liveWebSocket.onerror=()=>{clearTimeout(liveConnectTimer);isLiveReady=false;setConnectionStatus(WS_STATE.ERROR);if(!settled){settled=true;reject(new Error('WS接続エラー'))}};liveWebSocket.onclose=e=>{clearTimeout(liveConnectTimer);isLiveReady=false;setConnectionStatus(e.wasClean?WS_STATE.CLOSED:WS_STATE.ERROR,e.reason||`code ${e.code}`);if(!settled){settled=true;reject(new Error(`WS準備前に切断: ${e.code}`))}}});await startLiveAudioCapture()}
async function startLiveAudioCapture(){liveMediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});liveAudioContext=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});await liveAudioContext.resume();const source=liveAudioContext.createMediaStreamSource(liveMediaStream);liveProcessor=liveAudioContext.createScriptProcessor(4096,1,1);liveProcessor.onaudioprocess=e=>{if(!isLiveReady||liveWebSocket?.readyState!==WebSocket.OPEN)return;const f=e.inputBuffer.getChannelData(0),pcm=new Int16Array(f.length);for(let i=0;i<f.length;i++)pcm[i]=Math.max(-1,Math.min(1,f[i]))*0x7fff;const bytes=new Uint8Array(pcm.buffer);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const audio= btoa(binary);const msg=liveConfig?.audioMessageTemplate?JSON.parse(JSON.stringify(liveConfig.audioMessageTemplate)):{realtimeInput:{mediaChunks:[{mimeType:'audio/pcm;rate=16000',data:''}]}};if(msg.realtimeInput?.mediaChunks?.[0])msg.realtimeInput.mediaChunks[0].data=audio;else msg.audio=audio;liveWebSocket.send(JSON.stringify(msg))};source.connect(liveProcessor);liveProcessor.connect(liveAudioContext.destination)}
function handleLiveMessage(m){const interim=m.interimText||m.partialText||m.serverContent?.inputTranscription?.text||'';const final=m.finalText||m.serverContent?.outputTranscription?.text||'';if(interim)livePreviewText.textContent=interim;if(final){livePreviewText.textContent=final;const id=`card_${Date.now()}_${Math.random().toString(36).slice(2)}`;addTranscriptItem({id,time:new Date().toLocaleTimeString('ja-JP',{hour12:false}),speaker:'話者 (自動判定中)',originalText:final,translatedText:'',engine:'Gemini Live',direction:directionSelect.value,autoSpeaker:true,isTranslating:true});processPass2(id,final,categorySelect.value,directionSelect.value)}if(m.error)setConnectionStatus(WS_STATE.ERROR,m.error.message||'サーバーエラー')}
function stopGeminiLiveStreaming(){clearTimeout(liveConnectTimer);isLiveReady=false;if(liveProcessor){liveProcessor.onaudioprocess=null;try{liveProcessor.disconnect()}catch{}liveProcessor=null}liveMediaStream?.getTracks().forEach(t=>t.stop());liveMediaStream=null;if(liveAudioContext&&liveAudioContext.state!=='closed')liveAudioContext.close();liveAudioContext=null;if(liveWebSocket){try{if(liveWebSocket.readyState===WebSocket.OPEN)liveWebSocket.close(1000,'user stop');else liveWebSocket.close()}catch{}liveWebSocket=null}}
function startWebSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)throw new Error('Web Speech API非対応です。');webSpeechRecognition=new SR();webSpeechRecognition.continuous=true;webSpeechRecognition.interimResults=false;webSpeechRecognition.lang=directionSelect.value==='JA_TO_EN'?'ja-JP':'en-US';webSpeechRecognition.onresult=e=>{const text=e.results[e.results.length-1][0].transcript.trim();if(!text)return;const id=`card_${Date.now()}_${Math.random().toString(36).slice(2)}`;addTranscriptItem({id,time:new Date().toLocaleTimeString('ja-JP',{hour12:false}),speaker:roles[1],originalText:text,translatedText:'',engine:'Web Speech',direction:directionSelect.value,isTranslating:true});processPass2(id,text,categorySelect.value,directionSelect.value)};webSpeechRecognition.onerror=e=>{if(e.error!=='no-speech')statusText.textContent=`音声認識エラー: ${e.error}`};webSpeechRecognition.start()}
async function processLocalWhisper(blob,id,time,category){const endpoint=localStorage.getItem('local_whisper_url')||localEndpointInput.value.trim();if(!endpoint)return alert('Local Whisper URLが未設定です。');const fd=new FormData();fd.append('audio_file',blob,'recording.webm');try{const res=await fetch(endpoint,{method:'POST',body:fd});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json(),text=data.text||'';if(text.trim()){addTranscriptItem({id,time,speaker:roles[1],originalText:text,translatedText:'',engine:'Whisper',direction:directionSelect.value,isTranslating:true});processPass2(id,text,category,directionSelect.value)}}catch(e){statusText.textContent=`Local AI接続失敗: ${e.message}`}}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function addTranscriptItem(item){transcriptStore.push(item);persistTranscripts();renderCard(item)}
function renderCard(item){emptyState.style.display='none';saveBtn.disabled=false;const card=document.createElement('div');card.className='transcript-card';card.id=item.id;const sc=item.speaker?.includes('Auditor')?'auditor':item.speaker?.includes('Yard')?'yard':'';card.innerHTML=`<div class="card-meta"><div class="meta-left"><span>🕒 ${escapeHtml(item.time)}</span><span class="speaker-tag ${sc}" id="${item.id}_spk">${escapeHtml(item.speaker||'発話')}</span><span class="engine-tag">${escapeHtml(item.engine)}</span></div><div class="card-actions"><button class="card-action-btn" data-action="edit">✏️</button><button class="card-action-btn" data-action="retry">🔄</button><button class="card-action-btn" data-action="delete">🗑️</button></div></div><div class="card-body" id="${item.id}_view"><div class="text-column"><span class="column-label">原文</span><div class="original-text" id="${item.id}_orig">${escapeHtml(item.originalText)}</div></div><div class="text-column"><span class="column-label">訳文</span><div class="translated-text" id="${item.id}_trans">${item.isTranslating?'⏳ 翻訳中...':escapeHtml(item.translatedText)}</div></div></div><div class="edit-container" id="${item.id}_edit"><div class="edit-grid"><textarea class="edit-textarea" id="${item.id}_edit_orig">${escapeHtml(item.originalText)}</textarea><textarea class="edit-textarea" id="${item.id}_edit_trans">${escapeHtml(item.translatedText)}</textarea></div><div class="edit-btn-row"><button class="btn btn-clear" data-action="cancel">キャンセル</button><button class="btn btn-record" data-action="save">保存</button></div></div>`;card.addEventListener('click',e=>{const a=e.target.dataset.action;if(a==='edit'){ $(`${item.id}_view`).style.display='none';$(`${item.id}_edit`).classList.add('active')}if(a==='cancel'){ $(`${item.id}_edit`).classList.remove('active');$(`${item.id}_view`).style.display='grid'}if(a==='save'){item.originalText=$(`${item.id}_edit_orig`).value.trim();item.translatedText=$(`${item.id}_edit_trans`).value.trim();$(`${item.id}_orig`).textContent=item.originalText;$(`${item.id}_trans`).textContent=item.translatedText;persistTranscripts();e.target.closest('.edit-container').classList.remove('active');$(`${item.id}_view`).style.display='grid'}if(a==='retry'){item.isTranslating=true;$(`${item.id}_trans`).textContent='⏳ 再翻訳中...';processPass2(item.id,item.originalText,categorySelect.value,directionSelect.value)}if(a==='delete'&&confirm('この発話を削除しますか？')){transcriptStore=transcriptStore.filter(x=>x.id!==item.id);persistTranscripts();card.remove();syncEmpty()}if(e.target.id===`${item.id}_spk`){let i=roles.indexOf(item.speaker);item.speaker=roles[(i+1+roles.length)%roles.length];e.target.textContent=item.speaker;persistTranscripts()}});logContainer.appendChild(card);logContainer.scrollTop=logContainer.scrollHeight}
function updateCardTranslation(id,text,direction,detectedLanguage){const el=$(`${id}_trans`);if(el)el.textContent=text;const item=transcriptStore.find(x=>x.id===id);if(item){item.translatedText=text;item.isTranslating=false;if(direction)item.direction=direction;if(detectedLanguage)item.detectedLanguage=detectedLanguage;persistTranscripts()}}
function persistTranscripts(){localStorage.setItem('transcript_cache',JSON.stringify(transcriptStore))}function syncEmpty(){const empty=transcriptStore.length===0;emptyState.style.display=empty?'block':'none';saveBtn.disabled=empty}function loadCache(){try{const v=JSON.parse(localStorage.getItem('transcript_cache')||'[]');if(Array.isArray(v)){transcriptStore=v;v.forEach(renderCard);syncEmpty()}}catch{localStorage.removeItem('transcript_cache')}}
function buildPhoneShareUrl(gas){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('gas',gas);return u.toString()}
recordBtn.addEventListener('click',toggleRecording);$('settingsBtn').onclick=()=>settingsModal.classList.add('open');$('closeModalBtn').onclick=()=>settingsModal.classList.remove('open');$('saveSettingsBtn').onclick=()=>{localStorage.setItem('gas_api_url',gasApiUrlInput.value.trim());localStorage.setItem('gemini_api_key',directApiKeyInput.value.trim());localStorage.setItem('local_whisper_url',localEndpointInput.value.trim());localStorage.setItem('trans_direction',directionSelect.value);settingsModal.classList.remove('open');alert('設定を保存しました。')};
$('sharePhoneBtn').onclick=()=>{const gas=getGasApiUrl();if(!isValidGasUrl(gas))return alert('正しいGAS Web App URLを入力してください。');if(typeof window.qrcode!=='function')return alert('QRコードライブラリを読み込めませんでした。');const url=buildPhoneShareUrl(gas);shareUrlInput.value=url;qrCodeContainer.replaceChildren();try{const qr=window.qrcode(0,'M');qr.addData(url);qr.make();qrCodeContainer.innerHTML=qr.createImgTag(6,12);sharePhoneArea.style.display='block'}catch(e){alert(`QRコード生成失敗: ${e.message}`)}};
$('copyShareUrlBtn').onclick=async()=>{try{await navigator.clipboard.writeText(shareUrlInput.value);alert('共有URLをコピーしました。')}catch(e){shareUrlInput.select();document.execCommand('copy')}};
$('testGasBtn').onclick=()=>{testGasResult.style.color='var(--muted)';testGasResult.textContent='確認中...';callApi('ping',{},r=>{testGasResult.style.color='var(--success)';testGasResult.textContent=`✓ 接続成功${r?.message?' '+r.message:''}`},e=>{testGasResult.style.color='var(--danger)';testGasResult.textContent=`接続失敗: ${e.message}`})};
$('refreshCacheBtn').onclick=()=>{cacheResult.textContent='更新中...';callApi('refreshGlossaryCache',{},r=>{cacheResult.style.color='var(--success)';cacheResult.textContent=`✓ ${r?.message||'完了'}`},e=>{cacheResult.style.color='var(--danger)';cacheResult.textContent=e.message})};
clearBtn.onclick=()=>{if(transcriptStore.length&&confirm('全ログを消去しますか？')){transcriptStore=[];localStorage.removeItem('transcript_cache');[...logContainer.querySelectorAll('.transcript-card')].forEach(x=>x.remove());syncEmpty()}};
copyMdBtn.onclick=async()=>{if(!transcriptStore.length)return alert('ログがありません。');let md=`# 現地監査 議事録 (${categorySelect.value})\n\n| 時刻 | 話者 | 原文 | 訳文 |\n|---|---|---|---|\n`;for(const t of transcriptStore){const clean=s=>String(s||'').replace(/\n/g,'<br>').replace(/\|/g,'\\|');md+=`| ${clean(t.time)} | ${clean(t.speaker)} | ${clean(t.originalText)} | ${clean(t.translatedText)} |\n`}try{await navigator.clipboard.writeText(md);alert('コピーしました。')}catch(e){alert(`コピー失敗: ${e.message}`)}};
saveBtn.onclick=()=>{saveBtn.disabled=true;callApi('saveToGoogleDoc',{transcriptList:transcriptStore,category:categorySelect.value,direction:directionSelect.value},r=>{saveBtn.disabled=false;if(confirm('保存しました。開きますか？')&&r?.docUrl)window.open(r.docUrl,'_blank','noopener')},e=>{saveBtn.disabled=false;alert(`保存失敗: ${e.message}`)})};
window.addEventListener('DOMContentLoaded',()=>{gasApiUrlInput.value=localStorage.getItem('gas_api_url')||'';directApiKeyInput.value=localStorage.getItem('gemini_api_key')||'';localEndpointInput.value=localStorage.getItem('local_whisper_url')||'';directionSelect.value=localStorage.getItem('trans_direction')||'AUTO';const gas=new URLSearchParams(location.search).get('gas');if(gas){if(isValidGasUrl(gas)){localStorage.setItem('gas_api_url',gas);gasApiUrlInput.value=gas;const u=new URL(location.href);u.searchParams.delete('gas');history.replaceState({},document.title,u.pathname+u.search+u.hash);alert('✓ スマホ連携完了')}else alert('共有URL内のGAS URLが不正です。')}loadCache()});
</script>
</body>

<style>
:root{--primary:#1b365d;--blue:#2a52be;--bg:#f4f6f9;--card:#fff;--text:#2c3e50;--muted:#7f8c8d;--border:#d6dbdf;--ok:#27ae60;--danger:#e74c3c;--warn:#f39c12}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 4px #0002;z-index:10}.brand,.controls,.status,.footer-actions,.meta,.meta-left,.card-actions{display:flex;align-items:center;gap:8px}.brand{font-weight:700}.status{font-size:.75rem;background:#ffffff26;padding:4px 10px;border-radius:20px}.dot{width:9px;height:9px;border-radius:50%;background:#95a5a6}.dot.recording{background:var(--danger);box-shadow:0 0 6px var(--danger);animation:pulse 1.2s infinite}.dot.ready{background:var(--ok);box-shadow:0 0 6px var(--ok)}@keyframes pulse{50%{transform:scale(1.3)}}
select,input,textarea{font:inherit;border:1px solid var(--border);border-radius:6px;padding:7px 10px}.controls select{color:var(--primary);font-size:.85rem;font-weight:600}.icon-btn{border:0;border-radius:6px;padding:8px;background:#ffffff33;color:#fff;cursor:pointer}main{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.empty{margin:auto;text-align:center;color:var(--muted);padding:40px 20px}.empty h3{color:var(--primary);margin-bottom:8px}
.live,.card{background:var(--card);border-radius:8px;padding:12px 16px}.live{display:none;border:2px solid var(--blue);box-shadow:0 4px 12px #2a52be26}.live-head{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;color:var(--blue)}.live-text{font-size:1.05rem;line-height:1.5;color:var(--primary);font-style:italic;min-height:24px}.card{border:1px solid var(--border);box-shadow:0 1px 3px #0001;display:flex;flex-direction:column;gap:8px}.meta{justify-content:space-between;flex-wrap:wrap;border-bottom:1px dashed var(--border);padding-bottom:6px;font-size:.75rem;color:var(--muted)}.tag{padding:2px 7px;border-radius:10px;font-weight:700}.speaker{background:#eaecee;border:1px solid #bdc3c7;cursor:pointer}.speaker.auditor{background:#d4efdf;color:#196f3d}.speaker.yard{background:#fcf3cf;color:#806000}.engine{background:#ebf3fb;color:var(--blue)}.body-grid,.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.column{display:flex;flex-direction:column;gap:4px}.label{font-size:.7rem;font-weight:700;color:var(--muted)}.original,.translation{font-size:.95rem;line-height:1.5;word-break:break-word}.translation{color:var(--primary);font-weight:500}.small-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 6px;cursor:pointer}.edit{display:none;flex-direction:column;gap:8px}.edit.open{display:flex}.edit textarea{width:100%;min-height:70px}.edit-actions,.modal-actions{display:flex;justify-content:flex-end;gap:8px}
footer{background:#fff;border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0));display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:10px 16px;border-radius:6px;font-weight:600;border:0;cursor:pointer}.primary{background:var(--primary);color:#fff}.primary.active{background:var(--danger)}.save{background:var(--ok);color:#fff}.btn:disabled{background:#bdc3c7;cursor:not-allowed}.outline{background:transparent;color:var(--muted);border:1px solid var(--border)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}.modal-box{background:#fff;border-radius:8px;padding:24px;width:90%;max-width:560px;max-height:90dvh;overflow:auto}.modal-head{display:flex;justify-content:space-between;color:var(--primary);font-weight:700;margin-bottom:16px}.group{margin-bottom:14px}.group label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px}.group input{width:100%}.hint{font-size:.75rem;color:var(--muted)}.result{font-size:.8rem;margin-left:8px}.qr{display:none;margin-top:10px;text-align:center;background:#f8fafc;padding:12px;border-radius:6px}.qr img{max-width:100%;height:auto}
@media(max-width:767px){header,footer{flex-direction:column;align-items:stretch}.controls{flex-wrap:wrap}.controls select{flex:1 1 45%;min-width:0}.body-grid,.edit-grid{grid-template-columns:1fr}.footer-actions{width:100%}.footer-actions .btn,#recordBtn{flex:1}.brand{justify-content:space-between}}
</style>

<body>
<header><div class="brand"><span>⚓ Bilingual Transcriber</span><div class="status"><span id="statusDot" class="dot"></span><span id="statusText">待機中</span></div></div><div class="controls">
<select id="directionSelect"><option value="AUTO">翻訳: 自動切替 (英⇄日)</option><option value="EN_TO_JA">固定: 英語 ➔ 日本語</option><option value="JA_TO_EN">固定: 日本語 ➔ 英語</option></select>
<select id="categorySelect"><option value="HKC">分野: HKC</option><option value="EU-SRR">分野: EU-SRR</option><option value="HSE">分野: HSE</option><option value="IHM">分野: IHM</option><option value="Common">分野: 全般</option></select>
<select id="engineSelect"><option value="GEMINI_UNARY" selected>Engine: Gemini (GAS連携)</option><option value="GEMINI_LIVE">Engine: Gemini Live (WS)</option><option value="WEB_SPEECH">Engine: Web Speech</option><option value="LOCAL_WHISPER">Engine: Local Whisper</option></select><button id="settingsBtn" class="icon-btn">⚙️</button></div></header>
<main id="logContainer"><div id="livePreview" class="live"><div class="live-head"><span>🔴 LIVE リアルタイム音声認識中</span><span class="tag engine">Gemini Live</span></div><div id="liveText" class="live-text">話しかけてください...</div></div><div id="emptyState" class="empty"><h3>対面ミーティング音声認識を開始してください</h3><p>「録音開始」を押すと文字起こし・翻訳を開始します。</p></div></main>
<footer><button id="recordBtn" class="btn primary">🎤 録音開始</button><div class="footer-actions"><button id="copyBtn" class="btn outline">📋 コピー</button><button id="clearBtn" class="btn outline">ログクリア</button><button id="saveBtn" class="btn save" disabled>💾 Google ドキュメントに保存</button></div></footer>
<div id="settingsModal" class="modal"><div class="modal-box"><div class="modal-head"><span>設定</span><button id="closeModalBtn" class="small-btn">×</button></div>
<div class="group"><label for="apiKeyInput">Gemini APIキー（Live直接接続時のみ）</label><input id="apiKeyInput" type="password" autocomplete="off" placeholder="API key"><small class="hint">通常運用ではGASが発行する短期トークンを推奨します。</small></div>
<div class="group"><label for="gasUrlInput">GAS Web App URL</label><input id="gasUrlInput" type="url" autocomplete="url" placeholder="https://script.google.com/macros/s/DEPLOYMENT_ID/exec"><div style="margin-top:6px"><button id="testGasBtn" class="btn outline">GAS接続テスト</button><span id="testGasResult" class="result"></span></div></div>
<div class="group"><label>📱 スマホ連携</label><button id="shareBtn" class="btn outline" style="width:100%">📲 設定URL / QRコード生成</button><div id="shareArea" class="qr"><div id="qrContainer"></div><input id="shareUrlInput" type="text" readonly><button id="copyShareBtn" class="btn outline" style="margin-top:6px">URLをコピー</button></div></div>
<div class="group"><label for="localUrlInput">Local Whisper URL</label><input id="localUrlInput" type="url" autocomplete="url" placeholder="http://192.168.1.50:8000/transcribe"></div>
<div class="group"><button id="refreshBtn" class="btn outline">🔄 辞書キャッシュ強制クリア</button><span id="cacheResult" class="result"></span></div><div class="modal-actions"><button id="saveSettingsBtn" class="btn primary">設定を保存</button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const recordBtn=$('recordBtn'),saveBtn=$('saveBtn'),statusDot=$('statusDot'),statusText=$('statusText'),logContainer=$('logContainer'),emptyState=$('emptyState'),directionSelect=$('directionSelect'),categorySelect=$('categorySelect'),engineSelect=$('engineSelect'),settingsModal=$('settingsModal'),gasUrlInput=$('gasUrlInput'),apiKeyInput=$('apiKeyInput'),localUrlInput=$('localUrlInput'),livePreview=$('livePreview'),liveText=$('liveText');
const GAS=typeof google!=='undefined'&&google.script&&google.script.run;
const WS={IDLE:'IDLE',TOKEN:'TOKEN',CONNECTING:'CONNECTING',OPEN:'OPEN',READY:'READY',CLOSED:'CLOSED',ERROR:'ERROR'};
const ROLES=['Auditor (監査員)','Yard Rep (ヤード担当者)','Facility (施設側)','Other (その他)'];
const LIVE_MODEL='gemini-3.5-transcribe-live';
let recording=false,stream=null,audioCtx=null,recorder=null,analyser=null,silenceTimer=null,maxTimer=null,chunks=[],speech=false,recognition=null,items=[];
let liveSocket=null,liveCtx=null,liveStream=null,liveProcessor=null,liveSource=null,connectTimer=null,liveReady=false;
let liveResumeHandle=null,liveReconnecting=false,liveCredential='',liveEphemeral=false,liveSetupObj=null;
const SILENCE_DB=-45,SILENCE_MS=1000,MAX_MS=14000;
function setStatus(state,detail=''){const m={IDLE:['待機中',''],TOKEN:['Live認証中...',''],CONNECTING:['WS接続中...',''],OPEN:['WS接続済み・初期化中...',''],READY:['LIVE接続完了','ready'],CLOSED:['WS切断',''],ERROR:['WS接続エラー','']};const [text,cls]=m[state]||m.ERROR;statusText.textContent=detail?`${text}: ${detail}`:text;statusDot.className=`dot ${cls}`;livePreview.style.display=state===WS.READY?'block':'none'}
function gasUrl(){return gasUrlInput.value.trim()||localStorage.getItem('gas_api_url')||''}function validGas(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&u.pathname.endsWith('/exec')}catch{return false}}
async function externalApi(action,payload){const url=gasUrl();if(!url)throw new Error('GAS Web App URLが未設定です。');const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),30000);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload}),signal:ctrl.signal,redirect:'follow'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error(`JSON以外の応答: ${text.slice(0,120)}`)}if(data?.success===false)throw new Error(data.error||'GAS処理失敗');return data}catch(e){if(e.name==='AbortError')throw new Error('GAS APIタイムアウト');throw e}finally{clearTimeout(timer)}}
function callApi(action,payload,ok,ng){ok=ok||(()=>{});ng=ng||console.error;if(!GAS){externalApi(action,payload).then(ok).catch(ng);return}const r=google.script.run.withSuccessHandler(ok).withFailureHandler(ng);switch(action){case'getLiveToken':r.createLiveSessionToken(payload.category);break;case'processAudioPass1':r.processAudioPass1(payload.audioBase64,payload.mimeType,payload.category);break;case'processTranslationPass2':r.processTranslationPass2(payload.originalText,payload.category,payload.direction);break;case'saveToGoogleDoc':r.saveToGoogleDoc(payload.transcriptList,payload.category,payload.direction);break;case'refreshGlossaryCache':r.refreshGlossaryCache();break;case'ping':ok({success:true,message:'GAS埋め込み環境'});break;default:ng(new Error(`未対応アクション: ${action}`))}}
function wsUrl(credential,ephemeral){const base=ephemeral?'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained':'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';return `${base}?${ephemeral?'access_token':'key'}=${encodeURIComponent(credential)}`}
// gemini-3.5-transcribe-live は文字起こし専用。systemInstruction / tools は非対応（送ると code=1007）。
// 有効なのは responseModalities:TEXT と inputAudioTranscription のみ。
function setupMessage(model){return{setup:{model:`models/${model}`,generationConfig:{responseModalities:['TEXT']},inputAudioTranscription:{languageCodes:[]},sessionResumption:{}}}}
function withResume(setup){try{if(liveResumeHandle&&setup&&setup.setup){setup.setup.sessionResumption={handle:liveResumeHandle}}}catch{}return setup}
async function startLive(){if(liveSocket&&liveSocket.readyState!==WebSocket.CLOSED)throw new Error('WS接続が既に存在します。');setStatus(WS.TOKEN);const key=apiKeyInput.value.trim()||localStorage.getItem('gemini_api_key')||'';let credential=key,ephemeral=false,tokenRes=null,model=LIVE_MODEL;if(!credential){tokenRes=await new Promise((resolve,reject)=>callApi('getLiveToken',{category:categorySelect.value},resolve,reject));credential=tokenRes?.token||tokenRes?.name||'';if(!tokenRes?.success||!credential)throw new Error(tokenRes?.error||'短期トークン取得失敗');ephemeral=true;model=tokenRes.model||model}
  // [修正1] マイクをsetupより前に取得しておき、setupComplete直後に音声を流せるようにする(アイドル1000クローズ対策)。
  await prepareLiveMic();
  liveCredential=credential;liveEphemeral=ephemeral;liveSetupObj=tokenRes?.setupMessage||setupMessage(model);liveResumeHandle=null;
  await openLiveSocket(true);
}
async function prepareLiveMic(){if(liveStream)return;if(!navigator.mediaDevices?.getUserMedia)throw new Error('マイク利用にはHTTPSが必要です。');liveStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});liveCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});await liveCtx.resume();liveSource=liveCtx.createMediaStreamSource(liveStream);liveProcessor=liveCtx.createScriptProcessor(4096,1,1);liveProcessor.onaudioprocess=e=>{if(!liveReady||liveSocket?.readyState!==WebSocket.OPEN)return;const f=e.inputBuffer.getChannelData(0),pcm=new Int16Array(f.length);for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));pcm[i]=v<0?v*0x8000:v*0x7fff}const bytes=new Uint8Array(pcm.buffer);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));liveSocket.send(JSON.stringify({realtimeInput:{audio:{data:btoa(binary),mimeType:'audio/pcm;rate=16000'}}}))};liveSource.connect(liveProcessor);liveProcessor.connect(liveCtx.destination)}
function openLiveSocket(isFirst){return new Promise((resolve,reject)=>{let settled=false;setStatus(isFirst?WS.CONNECTING:WS.TOKEN,isFirst?'':'再接続中');connectTimer=setTimeout(()=>{if(settled)return;settled=true;setStatus(WS.ERROR,'タイムアウト');try{liveSocket?.close(4000,'timeout')}catch{}reject(new Error('WS接続タイムアウト'))},10000);liveSocket=new WebSocket(wsUrl(liveCredential,liveEphemeral));liveSocket.onopen=()=>{setStatus(WS.OPEN);const base=(typeof liveSetupObj==='string')?liveSetupObj:JSON.parse(JSON.stringify(liveSetupObj));const setup=(typeof base==='string')?base:withResume(base);liveSocket.send(typeof setup==='string'?setup:JSON.stringify(setup))};liveSocket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return console.warn('非JSON WSメッセージ',e.data)}console.debug('Gemini Live:',m);if(m.setupComplete){clearTimeout(connectTimer);liveReady=true;liveReconnecting=false;setStatus(WS.READY);if(!settled){settled=true;resolve()}return}if(m.sessionResumptionUpdate){if(m.sessionResumptionUpdate.resumable&&m.sessionResumptionUpdate.newHandle)liveResumeHandle=m.sessionResumptionUpdate.newHandle;return}if(m.goAway){console.warn('goAway:',m.goAway);setStatus(WS.READY,'まもなく再接続');return}if(m.error){const d=m.error.message||JSON.stringify(m.error);setStatus(WS.ERROR,d);if(!settled){settled=true;clearTimeout(connectTimer);reject(new Error(d))}return}handleLiveMessage(m)};liveSocket.onerror=ev=>{console.error('WS error',ev);clearTimeout(connectTimer);liveReady=false;if(!settled){settled=true;setStatus(WS.ERROR,'ハンドシェイクまたは送信エラー');reject(new Error('WS接続エラー'))}};liveSocket.onclose=ev=>{console.error('WS close',{code:ev.code,reason:ev.reason,clean:ev.wasClean});clearTimeout(connectTimer);liveReady=false;if(!settled){settled=true;setStatus(WS.ERROR,`code ${ev.code}`);reject(new Error(`WS準備前に切断: code=${ev.code}`));return}
    // [修正2] 録音継続中に正常/一時切断(1000/1006)された場合は resumption handle で自動再接続。
    if(recording&&(ev.code===1000||ev.code===1006)&&!liveReconnecting){liveReconnecting=true;setStatus(WS.TOKEN,'再接続中');setTimeout(()=>{reconnectLive().catch(err=>{setStatus(WS.ERROR,'再接続失敗: '+err.message)})},600)}else{setStatus(ev.wasClean?WS.CLOSED:WS.ERROR,ev.reason||`code ${ev.code}`)}}})}
async function reconnectLive(){if(!recording)return;try{liveSocket=null;await openLiveSocket(false)}catch(e){throw e}}
function handleLiveMessage(m){const sc=m.serverContent||{};const interim=sc.interimInputTranscription?.text||m.interimText||m.partialText||'';const final=sc.inputTranscription?.text||'';if(interim)liveText.textContent=interim;if(final){liveText.textContent=final;const id=uid();addItem({id,time:now(),speaker:'話者 (自動判定中)',originalText:final.trim(),translatedText:'',engine:'Gemini Live',direction:directionSelect.value,isTranslating:true});translate(id,final.trim())}}
function stopLive(){clearTimeout(connectTimer);liveReady=false;liveReconnecting=false;liveResumeHandle=null;if(liveProcessor){liveProcessor.onaudioprocess=null;try{liveProcessor.disconnect()}catch{}liveProcessor=null}try{liveSource?.disconnect()}catch{}liveSource=null;liveStream?.getTracks().forEach(t=>t.stop());liveStream=null;if(liveCtx&&liveCtx.state!=='closed')liveCtx.close();liveCtx=null;if(liveSocket){try{liveSocket.close(1000,'user stop')}catch{}liveSocket=null}}
async function startNormal(){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;src.connect(analyser);startRecorder();monitor()}
function startRecorder(){chunks=[];const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];const type=types.find(t=>MediaRecorder.isTypeSupported?.(t))||'';recorder=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{clearTimeout(maxTimer);clearTimeout(silenceTimer);const had=speech,data=chunks;speech=false;chunks=[];if(data.length&&had)processBlob(new Blob(data,{type:recorder.mimeType}));if(recording){recorder.start();scheduleMax()}};recorder.start();scheduleMax()}
function scheduleMax(){clearTimeout(maxTimer);maxTimer=setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},MAX_MS)}function monitor(){const b=new Float32Array(analyser.fftSize);const run=()=>{if(!recording)return;analyser.getFloatTimeDomainData(b);let sum=0;for(const v of b)sum+=v*v;const db=20*Math.log10(Math.max(Math.sqrt(sum/b.length),1e-5));if(db>=SILENCE_DB){speech=true;clearTimeout(silenceTimer);silenceTimer=null}else if(speech&&!silenceTimer)silenceTimer=setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},SILENCE_MS);requestAnimationFrame(run)};requestAnimationFrame(run)}
function toBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(r.error||new Error('音声読込失敗'));r.onload=()=>{const s=String(r.result||''),i=s.indexOf(',');i<0?reject(new Error('Base64形式不正')):resolve(s.slice(i+1))};r.readAsDataURL(blob)})}
async function processBlob(blob){if(blob.size<3000)return;const id=uid(),time=now(),category=categorySelect.value;if(engineSelect.value==='LOCAL_WHISPER')return localWhisper(blob,id,time,category);try{const audioBase64=await toBase64(blob);statusText.textContent='認識中...';callApi('processAudioPass1',{audioBase64,mimeType:blob.type.split(';')[0],category},res=>{statusText.textContent=recording?'録音中 (REC)':'待機中';if(!res?.hasSpeech||!res.originalText)return;addItem({id,time,speaker:'話者 (自動判定中)',originalText:res.originalText,translatedText:'',engine:'Gemini',direction:directionSelect.value,isTranslating:true});translate(id,res.originalText)},e=>{statusText.textContent=recording?'録音中 (REC)':'待機中';alert(`音声認識エラー: ${e.message}`)})}catch(e){alert(e.message)}}
function startWebSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)throw new Error('Web Speech API非対応です。');recognition=new SR();recognition.continuous=true;recognition.interimResults=false;recognition.lang=directionSelect.value==='JA_TO_EN'?'ja-JP':'en-US';recognition.onresult=e=>{const text=e.results[e.results.length-1][0].transcript.trim();if(!text)return;const id=uid();addItem({id,time:now(),speaker:ROLES[1],originalText:text,translatedText:'',engine:'Web Speech',direction:directionSelect.value,isTranslating:true});translate(id,text)};recognition.onerror=e=>{if(e.error!=='no-speech')statusText.textContent=`音声認識エラー: ${e.error}`};recognition.start()}
async function localWhisper(blob,id,time,category){const endpoint=localStorage.getItem('local_whisper_url')||localUrlInput.value.trim();if(!endpoint)return alert('Local Whisper URLが未設定です。');const fd=new FormData();fd.append('audio_file',blob,'recording.webm');try{const r=await fetch(endpoint,{method:'POST',body:fd});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json(),text=d.text||'';if(text.trim()){addItem({id,time,speaker:ROLES[1],originalText:text,translatedText:'',engine:'Whisper',direction:directionSelect.value,isTranslating:true});translate(id,text)}}catch(e){statusText.textContent=`Local AI接続失敗: ${e.message}`}}
function translate(id,text){callApi('processTranslationPass2',{originalText:text,category:categorySelect.value,direction:directionSelect.value},r=>updateTranslation(id,r?.translatedText||'',r?.direction,r?.detectedLanguage),()=>updateTranslation(id,'【翻訳エラー / 再試行可能】'))}
async function toggle(){if(recording)return stopAll();recordBtn.disabled=true;try{const engine=engineSelect.value;if(engine==='GEMINI_LIVE')await startLive();else if(engine==='WEB_SPEECH')startWebSpeech();else{recording=true;await startNormal()}recording=true;recordBtn.classList.add('active');recordBtn.textContent='⏹️ 録音停止';if(engine!=='GEMINI_LIVE'){statusDot.className='dot recording';statusText.textContent='録音中 (REC)'}}catch(e){recording=false;stopLive();setStatus(WS.ERROR,e.message);alert(`録音を開始できませんでした:\n${e.message}`)}finally{recordBtn.disabled=false}}
function stopAll(){recording=false;speech=false;recordBtn.classList.remove('active');recordBtn.textContent='🎤 録音開始';stopLive();if(recorder&&recorder.state!=='inactive')recorder.stop();stream?.getTracks().forEach(t=>t.stop());stream=null;if(audioCtx&&audioCtx.state!=='closed')audioCtx.close();audioCtx=null;try{recognition?.stop()}catch{}recognition=null;clearTimeout(silenceTimer);clearTimeout(maxTimer);setStatus(WS.IDLE)}
function uid(){return `card_${Date.now()}_${Math.random().toString(36).slice(2)}`}function now(){return new Date().toLocaleTimeString('ja-JP',{hour12:false})}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function persist(){localStorage.setItem('transcript_cache',JSON.stringify(items))}function sync(){const empty=!items.length;emptyState.style.display=empty?'block':'none';saveBtn.disabled=empty}
function addItem(item){items.push(item);persist();render(item)}function render(item){emptyState.style.display='none';saveBtn.disabled=false;const card=document.createElement('div');card.className='card';card.id=item.id;const speakerClass=item.speaker?.includes('Auditor')?'auditor':item.speaker?.includes('Yard')?'yard':'';card.innerHTML=`<div class="meta"><div class="meta-left"><span>🕒 ${esc(item.time)}</span><span id="${item.id}_spk" class="tag speaker ${speakerClass}">${esc(item.speaker||'発話')}</span><span class="tag engine">${esc(item.engine)}</span></div><div class="card-actions"><button class="small-btn" data-a="edit">✏️</button><button class="small-btn" data-a="retry">🔄</button><button class="small-btn" data-a="delete">🗑️</button></div></div><div id="${item.id}_view" class="body-grid"><div class="column"><span class="label">原文</span><div id="${item.id}_orig" class="original">${esc(item.originalText)}</div></div><div class="column"><span class="label">訳文</span><div id="${item.id}_trans" class="translation">${item.isTranslating?'⏳ 翻訳中...':esc(item.translatedText)}</div></div></div><div id="${item.id}_edit" class="edit"><div class="edit-grid"><textarea id="${item.id}_edit_orig">${esc(item.originalText)}</textarea><textarea id="${item.id}_edit_trans">${esc(item.translatedText)}</textarea></div><div class="edit-actions"><button class="btn outline" data-a="cancel">キャンセル</button><button class="btn primary" data-a="save">保存</button></div></div>`;card.onclick=e=>{const a=e.target.dataset.a;if(a==='edit'){$(`${item.id}_view`).style.display='none';$(`${item.id}_edit`).classList.add('open')}if(a==='cancel'){$(`${item.id}_edit`).classList.remove('open');$(`${item.id}_view`).style.display='grid'}if(a==='save'){item.originalText=$(`${item.id}_edit_orig`).value.trim();item.translatedText=$(`${item.id}_edit_trans`).value.trim();$(`${item.id}_orig`).textContent=item.originalText;$(`${item.id}_trans`).textContent=item.translatedText;persist();$(`${item.id}_edit`).classList.remove('open');$(`${item.id}_view`).style.display='grid'}if(a==='retry'){$(`${item.id}_trans`).textContent='⏳ 再翻訳中...';translate(item.id,item.originalText)}if(a==='delete'&&confirm('この発話を削除しますか？')){items=items.filter(x=>x.id!==item.id);persist();card.remove();sync()}if(e.target.id===`${item.id}_spk`){let i=ROLES.indexOf(item.speaker);item.speaker=ROLES[(i+1+ROLES.length)%ROLES.length];e.target.textContent=item.speaker;persist()}};logContainer.appendChild(card);logContainer.scrollTop=logContainer.scrollHeight}
function updateTranslation(id,text,direction,language){const el=$(`${id}_trans`);if(el)el.textContent=text;const item=items.find(x=>x.id===id);if(item){item.translatedText=text;item.isTranslating=false;if(direction)item.direction=direction;if(language)item.detectedLanguage=language;persist()}}
recordBtn.onclick=toggle;$('settingsBtn').onclick=()=>settingsModal.classList.add('open');$('closeModalBtn').onclick=()=>settingsModal.classList.remove('open');$('saveSettingsBtn').onclick=()=>{localStorage.setItem('gas_api_url',gasUrlInput.value.trim());localStorage.setItem('gemini_api_key',apiKeyInput.value.trim());localStorage.setItem('local_whisper_url',localUrlInput.value.trim());localStorage.setItem('trans_direction',directionSelect.value);settingsModal.classList.remove('open');alert('設定を保存しました。')};
$('testGasBtn').onclick=()=>{const out=$('testGasResult');out.textContent='確認中...';callApi('ping',{},r=>{out.style.color='var(--ok)';out.textContent=`✓ 接続成功${r?.message?' '+r.message:''}`},e=>{out.style.color='var(--danger)';out.textContent=`接続失敗: ${e.message}`})};
$('shareBtn').onclick=()=>{const gas=gasUrl();if(!validGas(gas))return alert('正しいGAS Web App URLを入力してください。');if(typeof window.qrcode!=='function')return alert('QRコードライブラリを読み込めませんでした。');const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('gas',gas);$('shareUrlInput').value=u.toString();$('qrContainer').replaceChildren();try{const qr=window.qrcode(0,'M');qr.addData(u.toString());qr.make();$('qrContainer').innerHTML=qr.createImgTag(6,12);$('shareArea').style.display='block'}catch(e){alert(`QR生成失敗: ${e.message}`)}};$('copyShareBtn').onclick=async()=>{const input=$('shareUrlInput');try{await navigator.clipboard.writeText(input.value);alert('共有URLをコピーしました。')}catch{input.select();document.execCommand('copy')}};
$('refreshBtn').onclick=()=>{const out=$('cacheResult');out.textContent='更新中...';callApi('refreshGlossaryCache',{},r=>{out.style.color='var(--ok)';out.textContent=`✓ ${r?.message||'完了'}`},e=>{out.style.color='var(--danger)';out.textContent=e.message})};
$('clearBtn').onclick=()=>{if(items.length&&confirm('全ログを消去しますか？')){items=[];localStorage.removeItem('transcript_cache');[...logContainer.querySelectorAll('.card')].forEach(x=>x.remove());sync()}};$('copyBtn').onclick=async()=>{if(!items.length)return alert('ログがありません。');let md=`# 現地監査 議事録 (${categorySelect.value})\n\n| 時刻 | 話者 | 原文 | 訳文 |\n|---|---|---|---|\n`;const clean=s=>String(s||'').replace(/\n/g,'<br>').replace(/\|/g,'\\|');for(const t of items)md+=`| ${clean(t.time)} | ${clean(t.speaker)} | ${clean(t.originalText)} | ${clean(t.translatedText)} |\n`;try{await navigator.clipboard.writeText(md);alert('コピーしました。')}catch(e){alert(`コピー失敗: ${e.message}`)}};
saveBtn.onclick=()=>{saveBtn.disabled=true;callApi('saveToGoogleDoc',{transcriptList:items,category:categorySelect.value,direction:directionSelect.value},r=>{saveBtn.disabled=false;if(confirm('保存しました。開きますか？')&&r?.docUrl)window.open(r.docUrl,'_blank','noopener')},e=>{saveBtn.disabled=false;alert(`保存失敗: ${e.message}`)})};
window.addEventListener('DOMContentLoaded',()=>{gasUrlInput.value=localStorage.getItem('gas_api_url')||'';apiKeyInput.value=localStorage.getItem('gemini_api_key')||'';localUrlInput.value=localStorage.getItem('local_whisper_url')||'';directionSelect.value=localStorage.getItem('trans_direction')||'AUTO';const gas=new URLSearchParams(location.search).get('gas');if(gas){if(validGas(gas)){localStorage.setItem('gas_api_url',gas);gasUrlInput.value=gas;const u=new URL(location.href);u.searchParams.delete('gas');history.replaceState({},document.title,u.pathname+u.search+u.hash);alert('✓ スマホ連携完了')}else alert('共有URL内のGAS URLが不正です。')}try{const c=JSON.parse(localStorage.getItem('transcript_cache')||'[]');if(Array.isArray(c)){items=c;c.forEach(render)}}catch{localStorage.removeItem('transcript_cache')}sync()});
</script>
</body>
